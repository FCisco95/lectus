[package]
name = "chirp"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chirp_lib"
crate-type = ["cdylib", "rlib"]

[features]
# Serve the embedded frontend (dist/) instead of the dev server URL.
# Enabled by default so `cargo build --release` produces a standalone binary;
# `tauri dev` disables default features itself.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
arboard = "3"
# Windows: injecting into elevated windows needs uiAccess manifest entry
enigo = "=0.2.1"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
hound = "3.5"
# vulkan: GPU inference via ggml Vulkan backend — build needs the LunarG Vulkan
# SDK (VULKAN_SDK env var); runtime only needs vulkan-1.dll, shipped with GPU drivers.
whisper-rs = { version = "0.16", features = ["openmp", "vulkan"] }
# In-process cleanup LLM (Gemma 3 270M GGUF). Vulkan-offloaded like whisper;
# the model is tiny (~253 MB Q4_K_M) so it co-resides with the ASR model.
# MUST stay dynamic-link: whisper-rs links ggml statically, and a second static
# ggml in llama-cpp-sys-2 collides at link time (LNK2005 ggml_* duplicate
# symbols). Dynamic keeps llama's ggml inside its own DLLs; backends
# (ggml-vulkan.dll etc.) load at runtime via llama_cpp_2::load_backends().
llama-cpp-2 = { version = "0.1", features = ["vulkan", "dynamic-link", "dynamic-backends"] }
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-graphics = "0.24"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
