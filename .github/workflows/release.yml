name: Release

# Tag-driven: push v0.5.0 → build Windows + macOS, sign, draft release + latest.json for the updater.
# Human gate: the workflow produces a DRAFT release; publish it in the GitHub UI to go live.
on:
  push:
    tags: ['v*']

env:
  VULKAN_SDK_VERSION: '1.4.350.0'

permissions:
  contents: write # draft release + asset upload

jobs:
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.match.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail if tag version != tauri.conf.json version
        id: match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          PKG=$(jq -r .version package.json)
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG conf=$CONF pkg=$PKG cargo=$CARGO"
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::version mismatch — run scripts/bump-version.mjs $TAG and commit"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: version-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # arm64. macos-15 ships Xcode 16: the Xcode 15.4 clang on macos-14 fails on the
          # `armv9.2-a+…+nosve+sme` ggml-cpu variant that llama-cpp-sys-2's ALL_VARIANTS build emits.
          # --bundles app: skip the DMG — hdiutil hangs intermittently on GH runners, and the
          # updater only needs the .app.tar.gz that tauri-action derives from the .app bundle.
          - os: macos-15
            args: --bundles app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Short-path target: the whisper/llama C++ build hits MAX_PATH on the default target dir.
      # A junction keeps `target/release/...` valid for tauri.windows.conf.json resource paths.
      - name: Short-path target dir (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir D:\lt
          mklink /J src-tauri\target D:\lt
          echo CARGO_TARGET_DIR=D:\lt>>%GITHUB_ENV%

      # Bundled default ASR model (gitignored, ~77 MB).
      - name: Download bundled whisper model
        shell: bash
        run: bash scripts/download_model.sh

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lectus-release
          workspaces: src-tauri

      # --- Windows: replicate the local Vulkan build recipe from build-release.cmd ---
      - name: Vulkan SDK cache (Windows)
        if: runner.os == 'Windows'
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: vulkan-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/windows/vulkansdk-windows-X64-${{ env.VULKAN_SDK_VERSION }}.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan-installer.exe
          Start-Process -FilePath .\vulkan-installer.exe -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait

      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: npm ci
        run: npm ci

      - name: MSVC env (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # (vcvars env is exported for the tauri-action step below)

      - name: Vulkan / Ninja env (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}\Bin" >> $env:GITHUB_PATH
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          # whisper-rs-sys forwards GGML_* to CMake. Without this, whisper's statically linked ggml is
          # built with -march=native for the runner's CPU (AVX-512) and crashes with 0xc000001d
          # (illegal instruction) on machines without it (e.g. Ryzen 5800X). AVX2/FMA/F16C = portable baseline.
          echo "GGML_NATIVE=OFF" >> $env:GITHUB_ENV
          echo "GGML_AVX2=ON" >> $env:GITHUB_ENV
          echo "GGML_FMA=ON" >> $env:GITHUB_ENV
          echo "GGML_F16C=ON" >> $env:GITHUB_ENV

      # tauri-build validates the bundle resource globs (ggml/llama DLLs, backends/) inside chirp's
      # build script, which cargo may run before llama-cpp-sys-2 has produced them. Warm the target
      # dir first; --keep-going makes cargo finish the native deps even though chirp itself fails.
      - name: Prebuild native deps
        working-directory: src-tauri
        continue-on-error: true
        run: cargo build --release --keep-going

      - name: Build + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lectus ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          # No --target: macos-15 is an arm64 host, so the default triple is aarch64-apple-darwin.
          # Per-OS args come from the matrix (a `cond && '' || x` expression always yields x —
          # empty string is falsy in GH expressions).
          args: ${{ matrix.args }}
